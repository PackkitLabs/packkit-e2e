name: e2e

# Released-version ecosystem harness (SPEC.md). Runs the cross-repo journeys against
# the PUBLISHED (@latest) Packkit packages on a nightly schedule (so cross-repo drift
# surfaces within a day) and on demand. NOT on PRs — it tests published artifacts, not
# this repo's diff. On failure it opens/updates a single tracking issue (the proven
# dependency-freshness pattern) and closes it once everything is green again.
on:
  schedule:
    - cron: '0 7 * * *' # nightly, 07:00 UTC
  workflow_dispatch:
    inputs:
      journeys:
        description: 'Space-separated journey ids to run (blank = all), e.g. "j2 j6"'
        type: string
        default: ''

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # manage the single tracking issue
    steps:
      - uses: actions/checkout@v7

      # Provision every toolchain a journey may need. Each journey skips cleanly if its
      # tool is missing, but nightly should exercise the whole matrix.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0 (setup-uv publishes no moving major tag)
        with:
          enable-cache: false
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false # expose the real `tofu` binary to the harness
      - uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      # No lockfile is committed, so this resolves every dependency at @latest (SPEC §4).
      - name: Install the harness (resolves Packkit packages at @latest)
        run: npm install --no-audit --no-fund

      - name: Run journeys
        id: run
        run: node run.mjs ${{ inputs.journeys }}
        continue-on-error: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: results/

      - name: Open or update the tracking issue on failure
        if: steps.run.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'e2e: the published ecosystem is failing'
        run: |
          {
            echo "_Auto-generated by the e2e harness. A cross-repo journey failed against the **published** (@latest) packages. Versions tested are in \`results/versions.json\` (run artifact)._"
            echo
            echo '### Versions tested'
            echo '```json'
            cat results/versions.json 2>/dev/null || echo '{}'
            echo '```'
            echo
            echo '### Failing journeys'
            node -e "const r=require('./results/report.json').results; for(const j of r.filter(x=>x.status==='fail')){console.log('#### '+j.id+' — '+j.title+'\n\n```\n'+j.detail+'\n```\n')}" 2>/dev/null || echo '(report unavailable)'
            echo
            echo "[Run details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > issue.md
          NUM=$(gh issue list --state open --search "in:title $TITLE" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file issue.md
          else
            gh issue create --title "$TITLE" --body-file issue.md --label e2e 2>/dev/null \
              || gh issue create --title "$TITLE" --body-file issue.md
          fi

      - name: Close the tracking issue when green
        if: steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'e2e: the published ecosystem is failing'
        run: |
          NUM=$(gh issue list --state open --search "in:title $TITLE" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "The published ecosystem is green again — closing automatically."
          fi

      - name: Fail the run if a journey failed
        if: steps.run.outcome != 'success'
        run: exit 1
